# Deletes a PR's caches once it closes: nothing can use them, and they'd crowd out main's, which new PRs start from.
name: Cache cleanup

on:
  # _target so a fork's PR gets a token that can delete; nothing from the PR is checked out or run.
  pull_request_target:
    types: [closed]

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh cache delete --all --ref "refs/pull/${{ github.event.pull_request.number }}/merge" --succeed-on-no-caches
